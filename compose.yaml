services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: terminal_agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agent_pg:/var/lib/postgresql/data
volumes:
  agent_pg:
